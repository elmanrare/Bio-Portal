<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elman</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@v13/font/simple-icons.min.css" />
  <link href="./src/output.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="./config.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js" defer></script>
  <script src="./script.js" type="module"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="./theme.js" defer></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

</head>
<body class="min-h-screen flex items-center justify-center overflow-x-hidden overflow-y-auto select-none bg-linear-to-br from-gray-50 via-white to-gray-100 font-[CustomFont]">

  <div id="enter-gate" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 bg-black/80 backdrop-blur-md cursor-pointer transition-opacity duration-700">
    <h1 class="gate-title text-white text-3xl font-light tracking-[0.3em]">Welcome</h1>
    <span class="gate-hint text-white/60 text-xs tracking-[0.25em] uppercase">Click anywhere to enter</span>
    <span class="gate-pulse-ring" aria-hidden="true"></span>
  </div>

  <div class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
    <video 
      id="bg-video" 
      autoplay 
      loop 
      muted 
      playsinline 
      disablepictureinpicture 
      controlsList="nodownload nobrowser noplaybackrate"
      class="w-full h-full object-cover scale-105">
    </video>
    <div class="absolute inset-0 bg-white/50"></div>
  </div>

  <audio id="bg-audio"></audio>

  <button id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme" class="fixed top-8 right-24 z-30 flex h-12 w-12 shrink-0 items-center justify-center rounded-full border border-white/30 bg-white/20 text-white shadow-[0_0_15px_rgba(255,255,255,0.2)] backdrop-blur-md transition-all duration-300 hover:scale-110 hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] active:scale-95 cursor-pointer">
    <i data-lucide="moon" id="theme-icon"></i>
  </button>

  <button id="share-btn" type="button" aria-label="Share this page" title="Share this page" class="fixed top-8 right-8 z-30 flex h-12 w-12 shrink-0 items-center justify-center rounded-full border border-white/30 bg-white/20 text-white shadow-[0_0_15px_rgba(255,255,255,0.2)] backdrop-blur-md transition-all duration-300 hover:scale-110 hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] active:scale-95 cursor-pointer">
    <i data-lucide="share-2"></i>
  </button>

  <div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed left-1/2 top-8 z-40 -translate-x-1/2 translate-y-[-150%] rounded-full border border-white/30 bg-black/70 px-4 py-2 text-xs font-medium tracking-wide text-white opacity-0 shadow-lg backdrop-blur-md transition-all duration-300"></div>

  <div id="volume-control" class="volume-control fixed top-8 left-8 z-30 flex h-12 shrink-0 items-center gap-3 overflow-hidden rounded-full border border-white/30 bg-white/20 p-0 shadow-[0_0_15px_rgba(255,255,255,0.2)] backdrop-blur-md">
    <button id="audio-toggle" class="justify-content flex h-12 w-12 shrink-0 items-center rounded-full p-3 text-white transition-all duration-300 hover:scale-110 hover:text-gray-300 active:scale-100 cursor-pointer">
      <i data-lucide="volume-2" id="audio-icon" class=""></i>
    </button>
    <div class="volume-slider-wrap shrink-0 overflow-hidden">
      <input 
      type="range" 
      id="volume-slider" 
      min="0" 
      max="1" 
      step="0.01" 
      value="1.0"
      aria-label="Volume"
      class="w-full h-1.5 accent-white cursor-pointer rounded-lg appearance-none"
    />
    </div>
    </div>
    

  <div id="main-content" class="relative z-20 flex flex-col items-center justify-center w-full min-h-screen px-4 py-8 gap-5">
    
    <div 
      id="tilt-card"
      data-reveal
      data-tilt 
      data-tilt-max="6" 
      data-tilt-speed="300"
      data-tilt-scale="1.02"
      data-tilt-perspective="1200"
      data-tilt-reset="true"
      class="relative w-full max-w-md rounded-3xl p-8 bg-linear-to-br from-white/65 via-white/40 to-slate-100/30 backdrop-blur-xl border border-white/60 shadow-2xl flex flex-col items-center text-center">
      
      <figure class="relative w-24 h-24 rounded-full overflow-hidden border-3 border-gray-300 shadow-lg mb-6">
        <img id="user-avatar" src="" alt="Avatar" class="w-full h-full object-cover">
      </figure>

      <div class="user-name-row mb-2">
        <h1 id="user-name" class="text-3xl font-bold text-gray-900 tracking-wide"></h1>
        <div id="user-badges" class="user-badges" aria-label="Profile badges"></div>
      </div>

      <p id="user-bio" class="text-sm text-gray-600 leading-relaxed mb-6 line-clamp-3"></p>

      <div class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 mb-4 text-xs text-gray-500">
        <span class="inline-flex items-center gap-2">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="status-text">Status Loading...</span>
          </span>
        <span class="inline-flex items-center gap-2">
          <i class="items-center inline-flex fas fa-location-dot text-gray-400"></i>
          Georgia
          <span id="local-time" class="tabular-nums text-gray-400"></span>
        </span>
      </div>

      <div id="discord-activity" class="discord-activity mb-5 w-full" hidden>
        <img id="activity-art" class="activity-art" src="" alt="" hidden>
        <div class="activity-meta min-w-0 text-left">
          <p id="activity-name" class="activity-name truncate"></p>
          <p id="activity-detail" class="activity-detail truncate"></p>
          <p id="activity-state" class="activity-state truncate"></p>
        </div>
      </div>

      <div id="social-links" class="flex flex-wrap justify-center gap-3 w-full"></div>

      <div id="views-icon" class=" dark:text-cyan-400 absolute right-4 bottom-4 inline-flex items-center gap-1.5 rounded-full border border-white/50 bg-white/30 px-2.5 py-1 text-xs text-gray-600 shadow-sm backdrop-blur-md" aria-label="Profile views">
        <i class="fas fa-eye text-[10px]" aria-hidden="true"></i>
        <span id="view-count">0</span>
      </div>

    </div>

    <div id="music-player" data-reveal class="box-border music-player w-full max-w-md rounded-2xl p-5 backdrop-blur-xl bg-white/80 border border-white/40 shadow-xl">
      <div class="flex items-center gap-4 mb-5">
        <div class="song-art-wrap relative shrink-0 overflow-hidden rounded-xl shadow-lg">
          <img id="song-img" src="" alt="" class="song-art h-16 w-16 object-cover">
          <span class="song-art-shine absolute inset-0" aria-hidden="true"></span>
        </div>
        <div class="min-w-0 text-left">
          <p class="player-eyebrow mb-1 text-[10px] font-semibold uppercase tracking-widest text-gray-500">Now playing</p>
          <p id="song-title" class="font-semibold text-gray-900 text-base truncate"></p>
          <p id="song-artist" class="text-gray-500 text-xs truncate"></p>
        </div>
        <span id="playing-indicator" class="playing-indicator ml-auto shrink-0" aria-label="Paused" title="Paused">
          <span></span><span></span><span></span>
        </span>
      </div>

      <div class="mb-5">
        <div class="progress-track w-full bg-gray-300 rounded-full h-2 mb-2 cursor-pointer" id="progress-container" role="slider" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div id="progress-bar" class="progress-fill bg-gray-900 h-2 rounded-full" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-xs text-gray-500">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="flex items-center justify-center gap-4">
        <button id="prev-btn" type="button" aria-label="Previous track" class="player-control text-gray-600 hover:text-gray-900 transition-colors p-2 hover:scale-110">
          <i class="fas fa-step-backward text-lg"></i>
        </button>
        <button 
          id="play-pause-btn" 
          type="button"
          aria-label="Play track"
          class="player-control player-control-main w-12 h-12 rounded-full bg-black/20 hover:bg-black/30 border border-white/40 text-white flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.2)] hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] backdrop-blur-md transition-all duration-300 hover:scale-110 active:scale-95 cursor-pointer">
          <i id="play-pause-icon" class="fas fa-play text-base pl-0.5 drop-shadow-md"></i>
        </button>
        <button id="next-btn" type="button" aria-label="Next track" class="player-control text-gray-600 hover:text-gray-900 transition-colors p-2 hover:scale-110">
          <i class="fas fa-step-forward text-lg"></i>
        </button>
      </div>
    </div>

    <div id="shortcut-hint" data-reveal class="shortcut-hint flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-[10px] tracking-wide text-gray-500">
      <span><kbd>Space</kbd> play</span>
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> seek</span>
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> volume</span>
      <span><kbd>N</kbd><kbd>P</kbd> track</span>
      <span><kbd>M</kbd> mute</span>
      <span><kbd>T</kbd> theme</span>
    </div>

  </div>

</body>
</html>
